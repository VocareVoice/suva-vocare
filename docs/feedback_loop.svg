<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>Feedback loop: expert corrections in the UI, export, feedback-review report, human decision, prompt change, evaluation, release</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; font-weight: 700; fill: #111827; text-anchor: middle; }
    .s { font-size: 11px; fill: #374151; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #4b5563; }
    .rule { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .llm { fill: #fff1e6; stroke: #d9480f; stroke-width: 1.4; }
    .store { fill: #e8f1fb; stroke: #1c64b4; stroke-width: 1.2; }
    .app { fill: #e6f6f4; stroke: #0f766e; stroke-width: 1.2; }
    .human { fill: #f5f0ff; stroke: #6d28d9; stroke-width: 1.4; }
    .agent { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .edge { stroke: #4b5563; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .back { stroke: #4b5563; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  </style>
  <rect x="0" y="0" width="1000" height="330" fill="#ffffff"/>

  <!-- Row 1: collect -->
  <rect x="20" y="30" width="210" height="72" rx="6" class="app"/>
  <text x="125" y="54" class="t">1 Lawyers in the UI</text>
  <text x="125" y="72" class="s">correct a triage score</text>
  <text x="125" y="87" class="s">(Anpassungen), edit a summary</text>

  <rect x="270" y="30" width="210" height="72" rx="6" class="store"/>
  <text x="375" y="54" class="t">2 App database</text>
  <text x="375" y="72" class="s">expert triage rows, feedback,</text>
  <text x="375" y="87" class="s">edited summaries</text>

  <rect x="520" y="30" width="210" height="72" rx="6" class="rule"/>
  <text x="625" y="54" class="t">3 suva feedback-export</text>
  <text x="625" y="72" class="s">deterministic JSON, no LLM:</text>
  <text x="625" y="87" class="s">model vs expert, word diffs</text>

  <rect x="770" y="30" width="210" height="72" rx="6" class="agent"/>
  <text x="875" y="54" class="t">4 feedback-review skill</text>
  <text x="875" y="72" class="s">coding agent drafts a report:</text>
  <text x="875" y="87" class="s">patterns, suggested changes</text>

  <path d="M230 66 H266" class="edge"/>
  <path d="M480 66 H516" class="edge"/>
  <path d="M730 66 H766" class="edge"/>
  <path d="M875 102 V186" class="edge"/>
  <text x="883" y="150" class="lbl">report (advisory)</text>

  <!-- Row 2: decide, change, evaluate, release -->
  <rect x="770" y="190" width="210" height="72" rx="6" class="human"/>
  <text x="875" y="214" class="t">5 Human decision</text>
  <text x="875" y="232" class="s">legal team answers questions,</text>
  <text x="875" y="247" class="s">quality owner picks changes</text>

  <rect x="520" y="190" width="210" height="72" rx="6" class="human"/>
  <text x="625" y="214" class="t">6 Developer applies</text>
  <text x="625" y="232" class="s">one change per branch,</text>
  <text x="625" y="247" class="s">new PROMPT_VERSION</text>

  <rect x="270" y="190" width="210" height="72" rx="6" class="rule"/>
  <text x="375" y="214" class="t">7 Evaluation</text>
  <text x="375" y="232" class="s">cross-quarter rule, hold-out</text>
  <text x="375" y="247" class="s">scores, blind reading</text>

  <rect x="20" y="190" width="210" height="72" rx="6" class="llm"/>
  <text x="125" y="214" class="t">8 Release</text>
  <text x="125" y="232" class="s">merge; Apertus re-runs triage</text>
  <text x="125" y="247" class="s">and summaries</text>

  <path d="M770 226 H734" class="edge"/>
  <path d="M520 226 H484" class="edge"/>
  <path d="M270 226 H234" class="edge"/>
  <text x="238" y="218" class="lbl">pass</text>
  <path d="M375 262 V300 H625 V266" class="back"/>
  <text x="440" y="295" class="lbl">fails: rejected, documented</text>
  <path d="M125 190 V106" class="edge"/>
  <text x="133" y="150" class="lbl">new outputs; expert</text>
  <text x="133" y="164" class="lbl">scores and edits kept</text>
</svg>
