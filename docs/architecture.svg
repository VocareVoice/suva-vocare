<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>suva-vocare architecture: build-time inputs, batch pipeline, serving, Apertus endpoint</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 13px; font-weight: 700; fill: #111827; text-anchor: middle; }
    .s { font-size: 11px; fill: #374151; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #4b5563; }
    .group { font-size: 12px; font-weight: 700; fill: #374151; }
    .rule { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .llm { fill: #fff1e6; stroke: #d9480f; stroke-width: 1.4; }
    .store { fill: #e8f1fb; stroke: #1c64b4; stroke-width: 1.2; }
    .app { fill: #e6f6f4; stroke: #0f766e; stroke-width: 1.2; }
    .ext { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .edge { stroke: #4b5563; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .in { stroke: #4b5563; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  </style>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <!-- Build time -->
  <rect x="10" y="10" width="980" height="110" rx="8" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="24" y="30" class="group">Build time and data refresh (network needed)</text>
  <rect x="30" y="42" width="220" height="56" rx="6" class="ext"/>
  <text x="140" y="65" class="t">entscheidsuche.ch</text>
  <text x="140" y="83" class="s">open mirror of bger.ch</text>
  <rect x="270" y="42" width="220" height="56" rx="6" class="ext"/>
  <text x="380" y="65" class="t">Fedlex</text>
  <text x="380" y="83" class="s">SPARQL + HTML of UVG, ATSG, UVV</text>
  <rect x="510" y="42" width="220" height="56" rx="6" class="ext"/>
  <text x="620" y="65" class="t">Hugging Face</text>
  <text x="620" y="83" class="s">swiss-ai/Apertus-v1.5-70B</text>
  <rect x="750" y="42" width="220" height="56" rx="6" class="ext"/>
  <text x="860" y="65" class="t">Package registries</text>
  <text x="860" y="83" class="s">PyPI, Docker Hub, ghcr.io</text>

  <path d="M140 98 V158" class="in"/>
  <text x="147" y="140" class="lbl">corpus (suva.fetch)</text>
  <path d="M380 98 V158" class="in"/>
  <text x="387" y="140" class="lbl">law snapshots (suva.laws)</text>
  <path d="M620 98 V158" class="in"/>
  <text x="627" y="140" class="lbl">weights, once</text>
  <path d="M860 98 V158" class="in"/>
  <text x="867" y="140" class="lbl">image (uv.lock)</text>

  <!-- Runtime perimeter -->
  <rect x="10" y="160" width="980" height="470" rx="8" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
  <text x="24" y="182" class="group">Runtime: on-premise or air-gapped, Docker Compose; no outbound connection except adding one ruling by number</text>

  <!-- Batch pipeline -->
  <rect x="30" y="200" width="160" height="56" rx="6" class="store"/>
  <text x="110" y="223" class="t">Corpus</text>
  <text x="110" y="241" class="s">6,030 BGer rulings</text>

  <rect x="30" y="280" width="160" height="56" rx="6" class="rule"/>
  <text x="110" y="303" class="t">Add by number</text>
  <text x="110" y="321" class="s">ingest.py, online only</text>

  <rect x="215" y="200" width="140" height="56" rx="6" class="rule"/>
  <text x="285" y="223" class="t">segment.py</text>
  <text x="285" y="241" class="s">parts of a ruling</text>

  <rect x="380" y="200" width="150" height="56" rx="6" class="rule"/>
  <text x="455" y="223" class="t">Prior + gate</text>
  <text x="455" y="241" class="s">keywords, merits only</text>
  <rect x="380" y="280" width="150" height="56" rx="6" class="rule"/>
  <text x="455" y="303" class="t">Facts by rule</text>
  <text x="455" y="321" class="s">statutes, outcome, flags</text>
  <rect x="380" y="360" width="150" height="56" rx="6" class="rule"/>
  <text x="455" y="383" class="t">Rule checks</text>
  <text x="455" y="401" class="s">refs vs segments, figures</text>

  <rect x="555" y="200" width="190" height="56" rx="6" class="llm"/>
  <text x="650" y="223" class="t">Apertus triage</text>
  <text x="650" y="241" class="s">level 0-9 via logprobs, DE + FR</text>
  <rect x="555" y="280" width="190" height="56" rx="6" class="llm"/>
  <text x="650" y="303" class="t">Apertus classification</text>
  <text x="650" y="321" class="s">two-level taxonomy, JSON enums</text>
  <rect x="555" y="360" width="190" height="56" rx="6" class="llm"/>
  <text x="650" y="383" class="t">Apertus summaries</text>
  <text x="650" y="401" class="s">DE + FR, per-sentence check</text>

  <rect x="780" y="200" width="190" height="216" rx="6" class="store"/>
  <text x="875" y="282" class="t">SQLite + FTS5</text>
  <text x="875" y="300" class="s">data/suva.db</text>
  <text x="875" y="322" class="s">scores, explanations,</text>
  <text x="875" y="338" class="s">categories, summaries,</text>
  <text x="875" y="354" class="s">headlines, full text</text>

  <path d="M190 228 H213" class="edge"/>
  <path d="M190 308 H240 V258" class="edge"/>
  <path d="M355 228 H378" class="edge"/>
  <path d="M285 256 V308 H378" class="edge"/>
  <path d="M285 308 V388 H378" class="edge"/>
  <path d="M530 228 H553" class="edge"/>
  <path d="M530 308 H553" class="edge"/>
  <path d="M555 378 H532" class="edge"/>
  <path d="M530 398 H553" class="edge"/>
  <path d="M745 228 H778" class="edge"/>
  <path d="M745 308 H778" class="edge"/>
  <path d="M745 388 H778" class="edge"/>

  <!-- Serving -->
  <rect x="30" y="460" width="160" height="56" rx="6" class="store"/>
  <text x="110" y="483" class="t">Law texts</text>
  <text x="110" y="501" class="s">UVG, ATSG, UVV (DE, FR)</text>
  <rect x="380" y="460" width="150" height="56" rx="6" class="llm"/>
  <text x="455" y="483" class="t">Apertus agent</text>
  <text x="455" y="501" class="s">tools: laws, rulings</text>
  <rect x="555" y="460" width="190" height="56" rx="6" class="app"/>
  <text x="650" y="483" class="t">FastAPI + web UI</text>
  <text x="650" y="501" class="s">static files, no CDN, DE / FR</text>
  <rect x="780" y="460" width="190" height="56" rx="6" class="ext"/>
  <text x="875" y="483" class="t">Lawyer's browser</text>
  <text x="875" y="501" class="s">inside the organisation</text>

  <path d="M190 488 H378" class="edge"/>
  <path d="M532 488 H553" class="edge" style="marker-start: url(#arrow)"/>
  <path d="M747 488 H778" class="edge" style="marker-start: url(#arrow)"/>
  <path d="M875 416 V438 H690 V458" class="edge" style="marker-start: url(#arrow)"/>

  <!-- Apertus endpoint -->
  <rect x="380" y="548" width="590" height="62" rx="6" fill="#fde3cf" stroke="#d9480f" stroke-width="1.8"/>
  <text x="675" y="572" class="t">Apertus v1.5 70B behind an OpenAI-compatible endpoint (LLM_BASE_URL)</text>
  <text x="675" y="592" class="s">own GPUs, e.g. vLLM; every orange step calls it, with temperature 0 and an on-disk response cache</text>
  <path d="M455 516 V546" class="edge" style="marker-start: url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="548" width="14" height="14" rx="3" class="rule"/>
  <text x="52" y="559" class="lbl">deterministic code, no LLM</text>
  <rect x="30" y="570" width="14" height="14" rx="3" class="llm"/>
  <text x="52" y="581" class="lbl">Apertus call</text>
  <rect x="200" y="548" width="14" height="14" rx="3" class="store"/>
  <text x="222" y="559" class="lbl">data on disk</text>
  <rect x="200" y="570" width="14" height="14" rx="3" class="app"/>
  <text x="222" y="581" class="lbl">app server</text>
  <path d="M30 600 H60" class="in"/>
  <text x="68" y="604" class="lbl">network only at build time</text>
</svg>
